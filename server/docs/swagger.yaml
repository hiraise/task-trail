definitions:
  request.changePasswordReq:
    properties:
      newPassword:
        maxLength: 50
        minLength: 8
        type: string
      oldPassword:
        maxLength: 50
        minLength: 8
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  request.credentials:
    properties:
      email:
        type: string
      password:
        maxLength: 50
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  request.emailReq:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  request.resetPasswordReq:
    properties:
      password:
        maxLength: 50
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  request.verifyReq:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  response.ErrAPI:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      msg:
        type: string
    type: object
info:
  contact:
    email: musaev.ae@hiraise.net
    name: HiRaise
    url: https://hiraise.net/
  license:
    name: MIT License
    url: https://mit-license.org/
  title: Task Trail API
  version: "1.0"
paths:
  /v1/access/check:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/response.ErrAPI'
      security:
      - BearerAuth: []
      summary: check user authentication
      tags:
      - /v1/access
  /v1/access/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: user email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: login
      tags:
      - /v1/access
  /v1/access/logout:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: logout
      tags:
      - /v1/access
  /v1/access/password/change:
    post:
      consumes:
      - application/json
      parameters:
      - description: old and new passoword
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.changePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: change user password
      tags:
      - /v1/access
  /v1/access/password/reset:
    post:
      consumes:
      - application/json
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.emailReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid email
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: reset user password
      tags:
      - /v1/access
  /v1/access/password/reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.resetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: confirm reset user password
      tags:
      - /v1/access
  /v1/access/refresh:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: refresh user session
      tags:
      - /v1/access
  /v1/access/register:
    post:
      consumes:
      - application/json
      description: endpoint for register new user
      parameters:
      - description: user email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "409":
          description: user already exists
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: register new user
      tags:
      - /v1/access
  /v1/access/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.verifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid token
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: verfiy user
      tags:
      - /v1/access
  /v1/access/verify/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.emailReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "401":
          description: invalid email
          schema:
            $ref: '#/definitions/response.ErrAPI'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/response.ErrAPI'
      summary: resend verification
      tags:
      - /v1/access
securityDefinitions:
  BearerAuth:
    in: cookie
    name: at
    type: apiKey
swagger: "2.0"
