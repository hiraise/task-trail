# Checks every PR and main (ADR-0009). The logic is in scripts/dev.sh, here is only the environment:
# any step can be reproduced locally with the same command.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new commit in a PR cancels the outdated run; a run on main that has started is not interrupted
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Project rules (ADRs, links, dependencies, screens)
        run: scripts/dev.sh rules

      - name: 'Server: vet, tests, golangci-lint'
        run: scripts/dev.sh server

      - name: 'Web: linter, tests, types and build'
        run: scripts/dev.sh web
