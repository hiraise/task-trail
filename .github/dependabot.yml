# Dependency updates (ADR-0021). Every Dependabot PR goes through CI; an update without a behavior
# change needs no ADR (ADR-0006). Major versions come in separate PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      server:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Node.js types have the same major version as Node.js in engines of web/package.json:
      # bump them manually together with it
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      web:
        update-types: [minor, patch]
        # A new generator version changes the types: a separate PR, the agent regenerates the types (ADR-0020)
        exclude-patterns:
          - '@hey-api/openapi-ts'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
