# Локальный стенд для разработки и приёмки (ADR-0010). Поднимается через scripts/dev.sh up:
# compose собирает и запускает сервисы, а scripts/stand-setup.mjs создаёт первый аккаунт
# и подключает почту через API администратора (ADR-0015, ADR-0017).
name: tasktrail

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tasktrail
      POSTGRES_USER: tasktrail
      POSTGRES_PASSWORD: tasktrail
    # С PostgreSQL 18 данные лежат в /var/lib/postgresql/<версия>/docker, поэтому том — на
    # /var/lib/postgresql: при следующем переходе версии новый том не понадобится
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktrail -d tasktrail"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Перехватчик почты: письма видны в веб-интерфейсе, наружу ничего не уходит. Сервер шлёт
  # в него без шифрования и без входа — так его подключает scripts/stand-setup.mjs.
  # Снаружи — порт 3025, а не обычный 8025: его часто занимает Mailpit других проектов.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:3025:8025"

  server:
    build:
      # Контекст — корень репозитория: сервер встраивает контракт из api/ (ADR-0023)
      context: ..
      dockerfile: server/docker/Dockerfile
    environment:
      APP_DEBUG: "true"
      # Веб обращается к API по /api, nginx срезает префикс; от него считаются пути cookie
      APP_ROOT_PATH: /api
      PG_CONNECTION_STRING: postgresql://tasktrail:tasktrail@postgres:5432/tasktrail?sslmode=disable
      # Секрет только для стенда: он слушает 127.0.0.1. На своём сервере — openssl rand -hex 32
      APP_SECRET: stand-only-secret-do-not-use-in-production
      FILES_DIR: /app/files
    volumes:
      - files:/app/files
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/settings/public"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: docker/Dockerfile
      args:
        API_URL: /api
        ROOT_PATH: ""
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy

# База стенда — в томе database: схема старого API в прежнем томе postgres новому серверу
# не подходит. Файлы (ADR-0013) — в томе files; scripts/dev.sh reset стирает оба.
volumes:
  database:
  files:
