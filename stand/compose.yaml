# Local stack for development and acceptance (ADR-0010). Started via scripts/dev.sh up:
# compose builds and starts the services, and scripts/stand-setup.mjs creates the first account
# and connects mail via the admin API (ADR-0015, ADR-0017).
name: tasktrail

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tasktrail
      POSTGRES_USER: tasktrail
      POSTGRES_PASSWORD: tasktrail
    # Since PostgreSQL 18 data lives in /var/lib/postgresql/<version>/docker, so the volume is mounted on
    # /var/lib/postgresql: the next version upgrade will not need a new volume
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktrail -d tasktrail"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Mail catcher: emails are visible in its web UI, nothing leaves the machine. The server sends
  # to it without encryption and without authentication, as scripts/stand-setup.mjs configures it.
  # Exposed on port 3025, not the usual 8025: Mailpit of other projects often takes that one.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:3025:8025"

  server:
    build:
      # The context is the repository root: the server embeds the contract from api/ (ADR-0023)
      context: ..
      dockerfile: server/docker/Dockerfile
    environment:
      APP_DEBUG: "true"
      # The web calls the API at /api, nginx strips the prefix; cookie paths are based on it
      APP_ROOT_PATH: /api
      PG_CONNECTION_STRING: postgresql://tasktrail:tasktrail@postgres:5432/tasktrail?sslmode=disable
      # A secret for the local stack only: it listens on 127.0.0.1. On your own server, use openssl rand -hex 32
      APP_SECRET: stand-only-secret-do-not-use-in-production
      FILES_DIR: /app/files
    volumes:
      - files:/app/files
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/settings/public"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The same image as in a release (ADR-0042): its nginx serves the build and proxies /api to the server
  web:
    build:
      context: ../web
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy

# The stack database is in the database volume: the old API schema in the former postgres volume does not
# fit the new server. Files (ADR-0013) are in the files volume; scripts/dev.sh reset wipes both.
volumes:
  database:
  files:
