openapi: 3.1.0
info:
  title: TaskTrail API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    TaskTrail API contract — the source of truth for the server and the web (ADR-0005).
    General rules — ADR-0018: IDs are UUID strings, time is ISO 8601 in UTC, an empty value is `null`,
    a change responds with the changed resource, an error is `ApiError` with a code from `ErrorCode`.

    The session is two cookies with the HttpOnly, Secure and SameSite=Lax flags:
    `at` — the access token, path `/`; `rt` — the refresh token, path `/v1/auth/`, so that only
    the auth endpoints receive it, not the whole API. Cookie paths are relative to the API prefix (`APP_ROOT_PATH`).

    An ID in the path or in a query parameter that is not a UUID — `404 NOT_FOUND`. Any operation may
    respond with `500 INTERNAL`. The `details` keys in a validation error are request field paths, as in JSON:
    `newPassword`, `emails[3]`.

    Project roles (ADR-0003): `owner` — the owner, `admin` — an administrator, `member` — a member.
    Service administrator (`isAdmin`, ADR-0014) is a separate user flag; it gives no access
    to other people's projects.

    Swagger with this contract — `<API address>/docs/`, for the service administrator only (ADR-0014).

    Links in emails and API responses lead to web pages under the service address (ADR-0015), the token is
    in the `token` parameter: password reset — `<service address>/auth/reset?token=…`, invitation —
    `<service address>/auth/invite?token=…`. The web passes the token to the API only in the body (ADR-0018).
    The email to someone added to a project directly leads to the project page —
    `<service address>/projects/{projectId}`.
servers:
  - url: ..
    description: the server Swagger was opened from — an address relative to `<API address>/docs/openapi.yaml`
  - url: http://localhost:3000/api
    description: local stack, `scripts/dev.sh up`
  - url: http://localhost:8080
    description: the server directly
security:
  - cookieAuth: []
tags:
  - name: auth
    description: sign-in, session, password, first account and invitations (ADR-0016, ADR-0017)
  - name: users
    description: the current user and other users
  - name: projects
    description: projects and members
  - name: tasks
    description: tasks and their statuses (ADR-0002)
  - name: boards
    description: boards — a view over tasks of several projects (ADR-0029)
  - name: search
    description: search across projects, boards and tasks (ADR-0030)
  - name: files
    description: files (ADR-0013)
  - name: notifications
    description: notifications about tasks (ADR-0038)
  - name: admin
    description: service settings and users — for the service administrator only (ADR-0014, ADR-0015)

paths:
  /v1/settings/public:
    get:
      tags: [auth]
      operationId: getPublicSettings
      summary: Settings the web needs before sign-in
      security: []
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Whether registration is open and mail is enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create the first account
      description: |
        Works only while the service has no users. The first account becomes
        the service administrator, `serviceUrl` is saved as the service address (ADR-0015).
        After creation the user is signed in right away: the response sets the session cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Account created, session opened
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409":
          description: "`REGISTRATION_CLOSED` — the first account has already been created"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Session opened
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          description: "`INVALID_CREDENTIALS` — wrong email or password"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Refresh the session
      description: |
        Reads the `rt` cookie and issues a new cookie pair. The same refresh token within 30 seconds
        after a refresh is a parallel request from another tab: it also gets a new pair.
        Later reuse is treated as theft and revokes all of the user's tokens.
      security:
        - refreshCookie: []
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Session refreshed
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: Revokes the refresh token from the `rt` cookie and deletes both cookies, even if the token is invalid.
      security:
        - refreshCookie: []
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Session closed
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }

  /v1/auth/check:
    get:
      tags: [auth]
      operationId: checkSession
      summary: Check that the session is valid
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: The user is signed in
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Password changed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: |
            `WRONG_PASSWORD` — wrong current password; `PASSWORD_SAME_AS_OLD` — the new password
            matches the current one; `VALIDATION_FAILED` — the data failed validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Send a password reset link
      description: |
        Sends an email with a reset link within the request (ADR-0017). The link is valid for 24 hours
        and works once. If the email is not registered, responds `204` and sends no email.
        The response time and `MAIL_SEND_FAILED` may still reveal that the email is registered: this
        is the price of letting the person know the email was not sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Email sent or the email address is not registered
        "409":
          description: "`MAIL_DISABLED` — mail is not configured, the administrator issues the link (ADR-0017)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/MailSendFailed" }

  /v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password via a reset link
      description: |
        The link works once: a reset deletes all of the user's reset links and closes
        all of their sessions. The current browser's cookies do not change — sign-in is needed next.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Password changed, all of the user's sessions closed
        "422":
          description: "`LINK_INVALID` — the link is wrong, used or expired; `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/auth/invitations/lookup:
    post:
      tags: [auth]
      operationId: lookupInvitation
      summary: Find out where an invitation link leads
      description: |
        The token is passed in the body, not in the URL, to stay out of logs (ADR-0018).
        If an account with the invitation email already exists, the link leads to sign-in: `INVITATION_ACCEPTED`,
        even when the invitation has expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: The invitation is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationInfo" }
        "409": { $ref: "#/components/responses/InvitationAccepted" }
        "422": { $ref: "#/components/responses/LinkInvalid" }

  /v1/auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Accept an invitation and create an account
      description: |
        Creates an account with the invitation email and opens a session right away. All valid
        invitations for this email become memberships with the `member` role (ADR-0016).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Account created, session opened
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/InvitationAccepted" }
        "422": { $ref: "#/components/responses/LinkInvalid" }

  /v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Current user
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [users]
      operationId: updateCurrentUser
      summary: Change the current user's name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCurrentUserRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: User changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/users/me/avatar:
    patch:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload an avatar
      description: |
        JPEG, PNG or WebP up to 5 MB; the type is detected from the file content (ADR-0013).
        The previous avatar is marked deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Avatar replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: "`FILE_TOO_LARGE`, `FILE_TYPE_NOT_ALLOWED` or `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/users/me/email-notifications:
    patch:
      tags: [users]
      operationId: setEmailNotifications
      summary: Turn notification emails on or off
      description: |
        Role: any signed-in user, for themselves. Notification emails are on by default; they go only
        while mail is connected (ADR-0038, ADR-0017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailNotificationsRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Switch saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/users/me/tasks:
    get:
      tags: [users]
      operationId: listCurrentUserTasks
      summary: Tasks assigned to the current user
      description: |
        In all of the user's projects except deleted ones; newest first. Active — neither the task nor its
        project is archived; with `archived=true` — the task or its project is archived (ADR-0027).
      parameters:
        - $ref: "#/components/parameters/Archived"
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: A user from your projects
      description: |
        Visible if you share a project or they are the author of a task in your project — so the author
        is still shown after leaving the project.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    get:
      tags: [files]
      operationId: getFile
      summary: File content
      description: |
        An avatar is served without sign-in: the ID is random, and `<img>` cannot refresh the session
        (ADR-0013). An attachment needs a session of a member of its task's project: without a valid session —
        `401`, so the client refreshes the session and retries; a non-member or a deleted task — `404` (ADR-0037).
      security:
        - {}
        - cookieAuth: []
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: File
          headers:
            Cache-Control:
              description: "`private, max-age=31536000, immutable` — a file never changes for a given ID"
              schema: { type: string }
            X-Content-Type-Options:
              description: "`nosniff`"
              schema: { type: string }
            Content-Disposition:
              description: "`attachment` for everything except JPEG, PNG and WebP"
              schema: { type: string }
          content:
            "*/*":
              schema:
                description: The type is the file's MIME type saved at upload
        "401":
          description: "`UNAUTHENTICATED` — an attachment without a valid session"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the user is a member of
      description: |
        Any signed-in user. Newest first. Active projects; with `archived=true` — archived ones (ADR-0027).
      parameters:
        - $ref: "#/components/parameters/Archived"
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      description: |
        Any signed-in user; the creator becomes the owner. Emails from `emails`
        are invited as in `addProjectMembers`, with the same response time.
        The key is unique among non-deleted projects (ADR-0026).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/ProjectKeyTaken" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/projects/candidates:
    get:
      tags: [projects]
      operationId: listProjectCandidates
      summary: Who can be invited to a project
      description: |
        Users who share a project with the current user. Without `projectId` — any signed-in
        user. With `projectId` — excluding members of that project, role in it: `owner` or `admin`.
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      summary: The project and the current user's role in it
      description: "Role: any in the project."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetails" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Change the name, description or key
      description: |
        Role: `owner` or `admin`; the key — only `owner`. A new key changes the keys of all project
        tasks, numbers stay (ADR-0026). An archived project does not change (ADR-0027).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Project changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetails" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PROJECT_KEY_TAKEN` — the key is taken by another project; `PROJECT_ARCHIVED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project
      description: "Role: `owner`. Soft delete (ADR-0001); an archived project too."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Project deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/archived:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [projects]
      operationId: setProjectArchived
      summary: Archive or restore a project
      description: |
        Role: `owner` (ADR-0027). An archived project, its members and tasks are read-only; it can be
        restored, deleted and left. The tasks keep their own archive flags. The current value again
        changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetArchivedRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Project archived or restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetails" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: Project members
      description: "Role: any in the project."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      operationId: addProjectMembers
      summary: Invite to a project by email
      description: |
        Role: `owner` or `admin`; the project is not archived. A registered email becomes a member right away
        with the `member` role, an unregistered one gets an invitation (ADR-0016). The result is
        per email in request order. Emails are sent in parallel, at most 10 seconds
        each, so the response may take up to 15 seconds: the client timeout is at least 20 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMembersRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Result per email
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvitationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [projects]
      operationId: changeProjectMemberRole
      summary: Change a member's role
      description: "Role: `owner`. Assigns `admin` or `member`; the owner role cannot be transferred. Not in an archived project."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRoleRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Role changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Remove a member
      description: |
        Role: `owner` removes anyone except themselves; `admin` — only members with the `member` role.
        The removed member's tasks in this project, archived ones included, are left without an assignee.
        Not in an archived project.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Member removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }

  /v1/projects/{projectId}/leave:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    delete:
      tags: [projects]
      operationId: leaveProject
      summary: Leave a project
      description: |
        Role: `admin` or `member`; an archived project too. The leaving user's tasks in this project,
        archived ones included, are left without an assignee (ADR-0027).
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: The user is no longer a member
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`OWNER_CANNOT_LEAVE` — the owner cannot leave, only delete the project"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/projects/{projectId}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listProjectLabels
      summary: Project labels
      description: "Role: any in the project; an archived project too. Ordered by name ignoring case (ADR-0035)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [projects]
      operationId: createProjectLabel
      summary: Create a label
      description: "Role: any in the project; not in an archived project (ADR-0035)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabelRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Label created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/projects/{projectId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/LabelId"
    patch:
      tags: [projects]
      operationId: updateProjectLabel
      summary: Rename or recolor a label
      description: "Role: `owner` or `admin`; not in an archived project (ADR-0035)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabelRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Label changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LabelConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [projects]
      operationId: deleteProjectLabel
      summary: Delete a label
      description: |
        Role: `owner` or `admin`; not in an archived project. The label is deleted at once and removed
        from all tasks; no history event (ADR-0035).
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Label deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }

  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [tasks]
      operationId: listProjectTasks
      summary: Project tasks
      description: |
        Role: any in the project. Newest first. By the task's own archive flag: active ones; with
        `archived=true` — archived ones. An archived project has both lists, read-only (ADR-0027).
      parameters:
        - $ref: "#/components/parameters/Archived"
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/task-statuses:
    get:
      tags: [tasks]
      operationId: listTaskStatuses
      summary: Task statuses
      description: Any signed-in user. The set is fixed (ADR-0003, ADR-0004) and the same in all projects.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Statuses in the order of work on a task
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task
      description: "Role: any in the project; the project is not archived. Status — `statusId`, without it — the status with `isDefault`; author — the current user. A task created from a board column passes the column's status (ADR-0029). With `parentId` the task is a subtask of an active task of the same project that is not a subtask itself (ADR-0036)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PROJECT_ARCHIVED` — the project is archived; `TASK_ARCHIVED` — the parent is archived"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: "`ASSIGNEE_NOT_MEMBER`, `TASK_PARENT_INVALID` or `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: Task
      description: "Role: any in the task's project."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Change the title or description
      description: "Role: any in the task's project; neither the task nor its project is archived."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Task changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      description: "Role: any in the task's project. Soft delete; an archived task too, but not in an archived project."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Task deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }

  /v1/tasks/{taskId}/status:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: changeTaskStatus
      summary: Change the status
      description: "Role: any in the task's project; neither the task nor its project is archived."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskStatusRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Status changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/priority:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: changeTaskPriority
      summary: Change the priority
      description: |
        Role: any in the task's project; neither the task nor its project is archived (ADR-0033).
        The same priority again changes nothing and writes no event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskPriorityRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Priority changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/due-date:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: changeTaskDueDate
      summary: Change the due date
      description: |
        Role: any in the task's project; neither the task nor its project is archived (ADR-0034).
        `dueDate: null` removes the due date; any valid day is accepted, also a past one. The same day
        again changes nothing and writes no event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskDueDateRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Due date changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/assignee:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: changeTaskAssignee
      summary: Change the assignee
      description: |
        Role: any in the task's project; neither the task nor its project is archived. The assignee is
        a project member; `assigneeId: null` removes the assignee.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskAssigneeRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Assignee changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/AssigneeInvalid" }

  /v1/tasks/{taskId}/parent:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: changeTaskParent
      summary: Attach a task to a parent or detach it
      description: |
        Role: any in the task's project; neither the task nor its project is archived (ADR-0036). The
        parent is an active task of the same project, not a subtask and not the task itself; a task
        with subtasks does not become a subtask. `parentId: null` detaches the task. Writes
        `parent_changed` on the task if the parent changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeTaskParentRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Parent changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`TASK_ARCHIVED` — the task or the parent is archived; `PROJECT_ARCHIVED` — the project is archived (ADR-0027)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: "`TASK_PARENT_INVALID` — the parent breaks the rules of ADR-0036 or is not found; `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/tasks/{taskId}/subtasks:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listSubtasks
      summary: Subtasks of a task
      description: "Role: any in the task's project. By number, archived subtasks included (ADR-0036)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Subtasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/project:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: moveTask
      summary: Move a task to another project
      description: |
        Role: any in both projects; neither project nor the task is archived. The task gets the next
        number of the new project and its key;
        a move to the task's own project changes nothing (ADR-0026). If the assignee is not a member
        of the new project, the task is left without an assignee. The status is kept. A subtask leaves
        its parent; the subtasks of a moved task are detached and stay in their project (ADR-0036).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveTaskRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Task moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/labels:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [tasks]
      operationId: setTaskLabels
      summary: Replace the task's labels
      description: |
        Role: any in the task's project; neither the task nor its project is archived. The labels are
        of the task's project; an empty list removes all. No history event (ADR-0035).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetTaskLabelsRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Labels set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422":
          description: "`LABEL_UNAVAILABLE` — a label is unknown or of another project; `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/tasks/{taskId}/archived:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: setTaskArchived
      summary: Archive or restore a task
      description: |
        Role: any in the task's project; the project is not archived (ADR-0027). An archived task is
        read-only: it can only be restored or deleted. The current value again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetArchivedRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Task archived or restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProjectArchived" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/comments:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listTaskComments
      summary: Task comments
      description: "Role: any in the task's project. Newest first; equal times — the later written first (ADR-0028)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskComment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tasks]
      operationId: createTaskComment
      summary: Write a comment
      description: "Role: any in the task's project; neither the task nor its project is archived (ADR-0027)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Comment written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskComment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/tasks/{taskId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [tasks]
      operationId: updateTaskComment
      summary: Edit a comment
      description: |
        Only the author, while less than 24 hours have passed since the comment was written (ADR-0028);
        neither the task nor its project is archived. A comment of another task — `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommentRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Comment edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskComment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommentReadOnly" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [tasks]
      operationId: deleteTaskComment
      summary: Delete a comment
      description: |
        The author, the project owner or a project admin, at any time (ADR-0028); neither the task nor
        its project is archived. The comment is erased at once. A comment of another task — `404`.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Comment deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }

  /v1/tasks/{taskId}/events:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listTaskEvents
      summary: Task change history
      description: "Role: any in the task's project. Newest first; equal times — the later written first (ADR-0028)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/attachments:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: listTaskAttachments
      summary: Task attachments
      description: "Role: any in the task's project. Newest first (ADR-0037)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [tasks]
      operationId: uploadTaskAttachment
      summary: Attach a file
      description: |
        Role: any in the task's project; neither the task nor its project is archived (ADR-0027).
        Any type up to 25 MB (ADR-0037); the type is detected from the file content (ADR-0013).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: File attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }
        "422":
          description: "`FILE_TOO_LARGE` or `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/tasks/{taskId}/attachments/{fileId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: fileId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    delete:
      tags: [tasks]
      operationId: deleteTaskAttachment
      summary: Delete an attachment
      description: |
        The uploader, the project owner or a project admin (ADR-0037); neither the task nor its project is
        archived. The file is marked deleted, cleanup erases it from disk (ADR-0013). A file of another
        task — `404`.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Attachment deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskReadOnly" }

  /v1/boards:
    get:
      tags: [boards]
      operationId: listBoards
      summary: Boards the user is a member of
      description: Any signed-in user. Newest first.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [boards]
      operationId: createBoard
      summary: Create a board
      description: |
        Any signed-in user; the creator becomes the owner and a member. Projects — only those where
        the owner is a member; members — only people who share a project with the owner, as in
        `listProjectCandidates` (ADR-0029). Repeated IDs and the owner in `memberIds` are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoardRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Board created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/BoardInvalid" }

  /v1/boards/{boardId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: getBoard
      summary: A board
      description: "Any board member. A non-member — `404` (ADR-0029)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [boards]
      operationId: updateBoard
      summary: Rename a board
      description: "The board owner; another member — `403`, a non-member — `404`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoardRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Board renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [boards]
      operationId: deleteBoard
      summary: Delete a board
      description: "The board owner. Deleted at once; the tasks stay (ADR-0029)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Board deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/boards/{boardId}/projects:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [boards]
      operationId: setBoardProjects
      summary: Replace the board projects
      description: |
        The board owner. Replaces the board projects where the owner is a member; projects the owner
        does not see stay on the board (ADR-0029). Each new project — one where the owner is a member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBoardProjectsRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Projects replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BoardInvalid" }

  /v1/boards/{boardId}/members:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [boards]
      operationId: addBoardMembers
      summary: Add board members
      description: |
        The board owner. Only people who share a project with the owner (ADR-0029); those already
        on the board are skipped. There are no email invitations to a board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddBoardMembersRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Members added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BoardInvalid" }

  /v1/boards/{boardId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [boards]
      operationId: removeBoardMember
      summary: Remove a board member
      description: "The board owner; not themselves. The member's tasks do not change."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Member removed
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`OWNER_CANNOT_LEAVE` — the owner cannot remove themselves, only delete the board"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/boards/{boardId}/leave:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    delete:
      tags: [boards]
      operationId: leaveBoard
      summary: Leave a board
      description: "A board member except the owner."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: The user is no longer a board member
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`OWNER_CANNOT_LEAVE` — the owner cannot leave, only delete the board"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/boards/{boardId}/tasks:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [boards]
      operationId: listBoardTasks
      summary: Board tasks
      description: |
        Any board member. Tasks of the board projects where the current user is a project member;
        neither the task nor its project is archived (ADR-0027); the assignee is a board member or
        nobody (ADR-0029). Recently updated first.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Search projects, boards and tasks
      description: |
        Any signed-in user. A case-insensitive substring match among what the user can see anyway
        (ADR-0030): projects where they are a member — by name and key; boards where they are a member —
        by name; tasks of their projects — by name, description and key (`DS-12`). `%` and `_` are
        matched as characters. Archived items are included and marked with `archivedAt` and
        `projectArchived`. At most 20 results per group. Projects and boards by name; tasks — the one
        whose key equals `q` (case does not matter) first, the rest recently updated first.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for; 1–100 characters after trimming, otherwise `422` with `details.q`
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: What was found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The current user's notifications
      description: |
        Role: any signed-in user, their own notifications. The newest 100, newest first; only
        notifications of tasks that are not deleted, in projects where the user is still a member
        (ADR-0038).
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: The newest 100 notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: countUnreadNotifications
      summary: How many notifications are unread
      description: |
        Role: any signed-in user. Counts the same notifications the list shows; the web polls it every
        60 seconds while the tab is visible (ADR-0038).
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Unread notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadNotifications" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [notifications]
      operationId: setNotificationRead
      summary: Mark a notification read or unread
      description: |
        Role: the notification's recipient; another user's notification is `404` (ADR-0038). Marking
        a read notification read again keeps its `readAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetNotificationReadRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Notification changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: readAllNotifications
      summary: Mark all notifications read
      description: "Role: any signed-in user, their own notifications (ADR-0038)."
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: All notifications are read
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/admin/settings:
    get:
      tags: [admin]
      operationId: getServiceSettings
      summary: Service settings
      description: Service administrator only.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updateServiceSettings
      summary: Change the service address
      description: |
        Service administrator only. A trailing `/` is dropped. Links issued earlier
        lead to the old address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceSettingsRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Settings changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/admin/settings/mail:
    put:
      tags: [admin]
      operationId: saveMailSettings
      summary: Connect mail or change its settings
      description: |
        Service administrator only.
        Before saving, the server connects to SMTP with these settings, signs in and asks whether
        SMTP will accept an email from `sender` — at most 10 seconds, no email is sent (ADR-0017).
        If the `password` field is not passed, the saved password stays. `SECRET_REQUIRED` is returned
        if `username` is set but there is no password: it was not passed and either was not saved, or
        the host or port changed (ADR-0015). Without `username` the password is not saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSettingsRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Mail connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`SECRET_REQUIRED` — the password must be entered again; `VALIDATION_FAILED`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502":
          description: "`MAIL_CONNECTION_FAILED` — could not connect to SMTP, sign in, or SMTP does not accept the sender; settings not saved"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      tags: [admin]
      operationId: disableMail
      summary: Disconnect mail
      description: |
        Service administrator only. The SMTP settings and password are deleted.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Mail disconnected
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/settings/mail/test:
    post:
      tags: [admin]
      operationId: sendTestMail
      summary: Send a test email to yourself
      description: Service administrator only.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "204":
          description: Email sent to the administrator's address
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`MAIL_DISABLED` — mail is not connected"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "502": { $ref: "#/components/responses/MailSendFailed" }

  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: All service users
      description: Service administrator only. By registration date, earliest first.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [admin]
      operationId: updateUserAdminFlag
      summary: Grant or revoke service administrator
      description: Service administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserRequest" }
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "200":
          description: User changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "409":
          description: "`LAST_ADMIN` — the last administrator cannot be revoked"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /v1/admin/users/{userId}/password-reset-link:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [admin]
      operationId: createPasswordResetLink
      summary: Get a password reset link for a user
      description: |
        Service administrator only. Needed when mail is not connected (ADR-0017). The administrator passes the link on.
        The link works once; it expires at `expiresAt`.
      responses:
        "500": { $ref: "#/components/responses/Internal" }
        "201":
          description: Link created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetLink" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: at
      description: access token, set by sign-in, registration and session refresh
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt
      description: refresh token, cookie path — `/v1/auth/`

  headers:
    SessionCookies:
      description: "`at` and `rt` — new values or deletion; flags — in the API description"
      required: true
      schema: { type: string }

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    LabelId:
      name: labelId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BoardId:
      name: boardId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    Archived:
      name: archived
      in: query
      required: false
      description: "`true` — archived items, `false` or absent — active ones (ADR-0027); another value — `422`"
      schema: { type: boolean, default: false }

  responses:
    Unauthenticated:
      description: "`UNAUTHENTICATED` — not signed in or the session has expired"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: "`FORBIDDEN` — insufficient project role, not the board owner, or no service administrator rights"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: "`NOT_FOUND` — the resource does not exist or the user is not a member of its project"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationFailed:
      description: "`VALIDATION_FAILED` — the data failed validation, fields are in `details`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    AssigneeInvalid:
      description: "`ASSIGNEE_NOT_MEMBER` — the assignee is not a project member; `VALIDATION_FAILED`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    LinkInvalid:
      description: "`LINK_INVALID` — the link is wrong or expired; `VALIDATION_FAILED`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InvitationAccepted:
      description: "`INVITATION_ACCEPTED` — an account with this email already exists, sign in instead"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ProjectKeyTaken:
      description: "`PROJECT_KEY_TAKEN` — the key is taken by another project"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ProjectArchived:
      description: "`PROJECT_ARCHIVED` — the project is archived: restore it first (ADR-0027)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    LabelConflict:
      description: "`LABEL_NAME_TAKEN` — the name is taken in the project ignoring case; `PROJECT_ARCHIVED` — the project is archived (ADR-0035)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TaskReadOnly:
      description: "`TASK_ARCHIVED` — the task is archived; `PROJECT_ARCHIVED` — its project or the target project is archived (ADR-0027)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    CommentReadOnly:
      description: "`COMMENT_EDIT_EXPIRED` — 24 hours have passed since the comment was written; `TASK_ARCHIVED` — the task is archived; `PROJECT_ARCHIVED` — its project is archived"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BoardInvalid:
      description: |
        `BOARD_PROJECT_UNAVAILABLE` — the board owner is not a member of a project from the request;
        `BOARD_MEMBER_UNAVAILABLE` — a user from the request shares no project with the owner (ADR-0029);
        `VALIDATION_FAILED`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Internal:
      description: "`INTERNAL` — server error"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    MailSendFailed:
      description: "`MAIL_SEND_FAILED` — SMTP did not accept the email"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 in UTC
    Email:
      type: string
      format: email
      maxLength: 254
      description: The server lowercases the email and trims surrounding whitespace (ADR-0016)
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: |
        At least 8 characters and at most 72 bytes in UTF-8 — the bcrypt limit; a Cyrillic letter takes
        2 bytes. Longer — `422 VALIDATION_FAILED`.
    Username:
      type: string
      minLength: 1
      maxLength: 100

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - REGISTRATION_CLOSED
        - WRONG_PASSWORD
        - PASSWORD_SAME_AS_OLD
        - LINK_INVALID
        - INVITATION_ACCEPTED
        - ASSIGNEE_NOT_MEMBER
        - OWNER_CANNOT_LEAVE
        - LAST_ADMIN
        - PROJECT_KEY_TAKEN
        - TASK_ARCHIVED
        - PROJECT_ARCHIVED
        - TASK_PARENT_INVALID
        - COMMENT_EDIT_EXPIRED
        - BOARD_PROJECT_UNAVAILABLE
        - BOARD_MEMBER_UNAVAILABLE
        - LABEL_NAME_TAKEN
        - LABEL_UNAVAILABLE
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - MAIL_DISABLED
        - MAIL_SEND_FAILED
        - MAIL_CONNECTION_FAILED
        - SECRET_REQUIRED
        - INTERNAL
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: For logs and debugging, not for showing to the user
        details:
          type: [object, "null"]
          description: Request field → what is wrong with it; only for `VALIDATION_FAILED`
          additionalProperties: { type: string }

    PublicSettings:
      type: object
      required: [registrationOpen, mailEnabled]
      properties:
        registrationOpen:
          type: boolean
          description: There are no users yet — the first account can be created
        mailEnabled:
          type: boolean
          description: Mail is connected — password recovery by email works

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
    RegisterRequest:
      type: object
      required: [email, password, username, serviceUrl]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        username: { $ref: "#/components/schemas/Username" }
        serviceUrl:
          type: string
          format: uri
          description: Web address with a path, e.g. `https://example.com/tasktrail` (ADR-0015)
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { $ref: "#/components/schemas/Password" }
        newPassword: { $ref: "#/components/schemas/Password" }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          description: The `token` parameter of the link `<service address>/auth/reset?token=…`
        password: { $ref: "#/components/schemas/Password" }
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: The `token` parameter of the link `<service address>/auth/invite?token=…`
    InvitationInfo:
      type: object
      required: [email, projectName, invitedBy]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        projectName: { type: string }
        invitedBy:
          type: string
          description: The inviter's name, or their email if there is no name
    AcceptInvitationRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          description: The `token` parameter of the link `<service address>/auth/invite?token=…`
        username: { $ref: "#/components/schemas/Username" }
        password: { $ref: "#/components/schemas/Password" }

    User:
      type: object
      required: [id, email, username, avatarId]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { $ref: "#/components/schemas/Email" }
        username:
          type: [string, "null"]
          maxLength: 100
        avatarId:
          type: [string, "null"]
          format: uuid
          description: Avatar file ID for `GET /v1/files/{fileId}`
    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [isAdmin, emailNotifications]
          properties:
            isAdmin:
              type: boolean
              description: Service administrator (ADR-0014)
            emailNotifications:
              type: boolean
              description: Notification emails; they go only while mail is connected (ADR-0038)
    UpdateCurrentUserRequest:
      type: object
      required: [username]
      properties:
        username:
          oneOf:
            - $ref: "#/components/schemas/Username"
            - type: "null"

    ProjectRole:
      type: string
      enum: [owner, admin, member]
    ProjectKey:
      type: string
      minLength: 2
      maxLength: 10
      pattern: '^\p{L}[\p{L}0-9]{1,9}$'
      description: |
        Project key, like `DS` or a Cyrillic one: letters of any alphabet and digits, starting with a letter
        (ADR-0026). The server trims and upper-cases it before validation and returns it upper-case.
    Project:
      type: object
      required: [id, name, description, key, archivedAt, createdAt, updatedAt, tasksCount]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
        key: { $ref: "#/components/schemas/ProjectKey" }
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: When the project was archived; `null` — active (ADR-0027)
        createdAt: { $ref: "#/components/schemas/DateTime" }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
        tasksCount:
          type: integer
          minimum: 0
          description: Tasks not archived on their own (ADR-0027)
    ProjectDetails:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [role]
          properties:
            role:
              $ref: "#/components/schemas/ProjectRole"
              description: The current user's role in the project
    CreateProjectRequest:
      type: object
      required: [name, key]
      properties:
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
        key: { $ref: "#/components/schemas/ProjectKey" }
        emails:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Email" }
    ProjectCreated:
      type: object
      required: [project, invitations]
      properties:
        project: { $ref: "#/components/schemas/ProjectDetails" }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/InvitationResult" }
    UpdateProjectRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
        key:
          $ref: "#/components/schemas/ProjectKey"
          description: Only the project owner changes the key
    Member:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/ProjectRole" }
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    AddMembersRequest:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/Email" }
    InvitationResult:
      type: object
      required: [email, result, inviteUrl]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        result:
          type: string
          enum: [added, invited, already_member, mail_failed]
          description: |
            `added` — the account exists, the person became a member; `invited` — an invitation was created;
            `already_member` — already a member; `mail_failed` — the invitation was created but the email
            was not sent, a repeated invitation sends a new one (ADR-0017)
        inviteUrl:
          type: [string, "null"]
          format: uri
          description: Invitation link — only with `invited` and mail disabled (ADR-0017)

    TaskStatusId:
      type: string
      enum: [open, in_progress, in_review, done]
    TaskStatus:
      type: object
      required: [id, name, isDefault, isResolved]
      properties:
        id: { $ref: "#/components/schemas/TaskStatusId" }
        name:
          type: string
          description: Russian display name for the UI, one per status `id`
        isDefault:
          type: boolean
          description: Status of a new task — only for `open`
        isResolved:
          type: boolean
          description: The task is done — only for `done`
    TaskPriority:
      type: string
      enum: [low, normal, high, urgent]
      description: Fixed set from the lowest (ADR-0033); display names live in the web
    LabelColor:
      type: string
      enum: [gray, red, orange, yellow, green, teal, blue, purple]
      description: Fixed palette (ADR-0035); the web draws each color with its design tokens
    LabelName:
      type: string
      minLength: 1
      maxLength: 30
      description: Trimmed by the server; unique in the project ignoring case
    Label:
      type: object
      required: [id, projectId, name, color]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        projectId: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/LabelName" }
        color: { $ref: "#/components/schemas/LabelColor" }
    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { $ref: "#/components/schemas/LabelName" }
        color: { $ref: "#/components/schemas/LabelColor" }
    UpdateLabelRequest:
      type: object
      minProperties: 1
      properties:
        name: { $ref: "#/components/schemas/LabelName" }
        color: { $ref: "#/components/schemas/LabelColor" }
    SetTaskLabelsRequest:
      type: object
      required: [labelIds]
      properties:
        labelIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
          description: The new set of the task's labels, all of its project; empty — no labels
    Task:
      type: object
      required: [id, projectId, number, key, name, description, statusId, priority, dueDate, authorId, assigneeId, archivedAt, projectArchived, labels, parentId, subtasksTotal, subtasksDone, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        projectId: { $ref: "#/components/schemas/Uuid" }
        number:
          type: integer
          minimum: 1
          description: Sequential within the project, never reused (ADR-0026)
        key:
          type: string
          description: "`<project key>-<number>`, like `DS-12`; changes with the project key and on a move"
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
        statusId: { $ref: "#/components/schemas/TaskStatusId" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        dueDate:
          type: [string, "null"]
          format: date
          description: A calendar day (ADR-0034); null — no due date
        authorId: { $ref: "#/components/schemas/Uuid" }
        assigneeId:
          type: [string, "null"]
          format: uuid
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: When the task was archived on its own; `null` — not archived (ADR-0027)
        projectArchived:
          type: boolean
          description: The task's project is archived; the task is read-only then too
        labels:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Label" }
          description: Ordered by name (ADR-0035)
        parentId:
          type: [string, "null"]
          format: uuid
          description: The parent task (ADR-0036); `null` — not a subtask
        subtasksTotal:
          type: integer
          minimum: 0
          description: Non-archived subtasks (ADR-0036)
        subtasksDone:
          type: integer
          minimum: 0
          description: Non-archived subtasks in a resolved status (ADR-0036)
        createdAt: { $ref: "#/components/schemas/DateTime" }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
    CreateTaskRequest:
      type: object
      required: [projectId, name]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
        assigneeId:
          type: [string, "null"]
          format: uuid
        statusId:
          $ref: "#/components/schemas/TaskStatusId"
          description: The status of the new task; absent — the status with `isDefault`.
        priority:
          $ref: "#/components/schemas/TaskPriority"
          description: The priority of the new task; absent — `normal`.
        dueDate:
          type: [string, "null"]
          format: date
          description: The due date of the new task (ADR-0034); absent or `null` — no due date.
        parentId:
          type: [string, "null"]
          format: uuid
          description: The parent in the same project (ADR-0036); absent or `null` — not a subtask.
    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 254 }
        description: { type: [string, "null"] }
    ChangeTaskStatusRequest:
      type: object
      required: [statusId]
      properties:
        statusId: { $ref: "#/components/schemas/TaskStatusId" }
    ChangeTaskPriorityRequest:
      type: object
      required: [priority]
      properties:
        priority: { $ref: "#/components/schemas/TaskPriority" }
    ChangeTaskDueDateRequest:
      type: object
      required: [dueDate]
      properties:
        dueDate:
          type: [string, "null"]
          format: date
          description: A calendar day `YYYY-MM-DD`; `null` removes the due date (ADR-0034)
    MoveTaskRequest:
      type: object
      required: [projectId]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
    SetArchivedRequest:
      type: object
      required: [archived]
      properties:
        archived:
          type: boolean
          description: "`true` — archive, `false` — restore (ADR-0027)"
    ChangeTaskAssigneeRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: [string, "null"]
          format: uuid
    ChangeTaskParentRequest:
      type: object
      required: [parentId]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
          description: The parent task; `null` detaches the task (ADR-0036)

    CommentText:
      type: string
      minLength: 1
      maxLength: 10000
      description: Plain text; the server trims spaces at the ends before validation (ADR-0028)
    TaskComment:
      type: object
      required: [id, taskId, author, text, createdAt, editedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        taskId: { $ref: "#/components/schemas/Uuid" }
        author:
          $ref: "#/components/schemas/User"
          description: Shown even if the author has left the project
        text: { $ref: "#/components/schemas/CommentText" }
        createdAt: { $ref: "#/components/schemas/DateTime" }
        editedAt:
          type: [string, "null"]
          format: date-time
          description: When the text was last edited; `null` — never
    Attachment:
      type: object
      required: [id, taskId, name, mimeType, size, author, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: File ID for `GET /v1/files/{fileId}`
        taskId: { $ref: "#/components/schemas/Uuid" }
        name:
          type: string
          description: The original file name without a path
        mimeType:
          type: string
          description: Detected from the content, may carry parameters like `charset`
        size:
          type: integer
          minimum: 0
          description: Bytes
        author:
          $ref: "#/components/schemas/User"
          description: The uploader; shown even if they have left the project
        createdAt: { $ref: "#/components/schemas/DateTime" }
    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text: { $ref: "#/components/schemas/CommentText" }
    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text: { $ref: "#/components/schemas/CommentText" }
    TaskEventKind:
      type: string
      enum: [created, edited, status_changed, priority_changed, due_date_changed, assignee_changed, moved, archived, restored, parent_changed]
      description: |
        What changed (ADR-0028): `created`; `edited` — the name or description, without the old text;
        `status_changed`; `priority_changed` (ADR-0033); `due_date_changed` (ADR-0034); `assignee_changed` — also when the assignee left or was removed from the
        project; `moved` — to another project, the task key changed; `archived`; `restored`;
        `parent_changed` — the task was attached to a parent, detached or lost its parent (ADR-0036).
    TaskEvent:
      type: object
      required: [id, taskId, kind, actor, createdAt, fromStatusId, toStatusId, fromPriority, toPriority, fromDueDate, toDueDate, fromUser, toUser, fromKey, toKey]
      description: |
        A row of task history. Change fields are always present and `null` unless the kind uses them:
        `status_changed` — `fromStatusId`, `toStatusId`; `priority_changed` — `fromPriority`,
        `toPriority`; `due_date_changed` — `fromDueDate`, `toDueDate` (`null` — no due date);
        `assignee_changed` — `fromUser`, `toUser`
        (`null` — no assignee); `moved` — `fromKey`, `toKey`; `parent_changed` — `fromKey`, `toKey`,
        the keys of the old and the new parent (`null` — no parent).
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        taskId: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/TaskEventKind" }
        actor:
          $ref: "#/components/schemas/User"
          description: Who made the change
        createdAt: { $ref: "#/components/schemas/DateTime" }
        fromStatusId:
          oneOf:
            - $ref: "#/components/schemas/TaskStatusId"
            - type: "null"
        toStatusId:
          oneOf:
            - $ref: "#/components/schemas/TaskStatusId"
            - type: "null"
        fromPriority:
          oneOf:
            - $ref: "#/components/schemas/TaskPriority"
            - type: "null"
        toPriority:
          oneOf:
            - $ref: "#/components/schemas/TaskPriority"
            - type: "null"
        fromDueDate:
          type: [string, "null"]
          format: date
        toDueDate:
          type: [string, "null"]
          format: date
        fromUser:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        toUser:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        fromKey: { type: [string, "null"] }
        toKey: { type: [string, "null"] }

    NotificationKind:
      type: string
      enum: [assigned, status_changed, commented, mentioned, due_soon, overdue]
      description: |
        What a notification is about and who gets it, never the person who acted (ADR-0038):
        `assigned` — the new assignee, also of a task created with an assignee; `status_changed` — the
        task author and the assignee; `commented` — the task author and the assignee; `mentioned` —
        a user mentioned in a comment, instead of `commented` (ADR-0039); `due_soon` — the assignee, the
        day before the due date; `overdue` — the assignee, the day after the due date if the task is
        not resolved.
    NotificationTask:
      type: object
      required: [id, key, name]
      description: The task a notification is about, with its current key and name
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        key: { type: string }
        name: { type: string }
    Notification:
      type: object
      required: [id, kind, task, actor, createdAt, readAt, fromStatusId, toStatusId, text, dueDate]
      description: |
        A notification of the current user about a task (ADR-0038). Change fields are always present
        and `null` unless the kind uses them: `status_changed` — `fromStatusId`, `toStatusId`;
        `commented` and `mentioned` — `text`; `due_soon` and `overdue` — `dueDate`.
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        task: { $ref: "#/components/schemas/NotificationTask" }
        actor:
          description: Who acted; `null` for due date reminders
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        createdAt: { $ref: "#/components/schemas/DateTime" }
        readAt:
          type: [string, "null"]
          format: date-time
          description: When the notification was read; `null` — unread
        fromStatusId:
          oneOf:
            - $ref: "#/components/schemas/TaskStatusId"
            - type: "null"
        toStatusId:
          oneOf:
            - $ref: "#/components/schemas/TaskStatusId"
            - type: "null"
        text:
          type: [string, "null"]
          description: The start of the comment — 200 characters, then `…` if it was longer
        dueDate:
          type: [string, "null"]
          format: date
    UnreadNotifications:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    SetNotificationReadRequest:
      type: object
      required: [read]
      properties:
        read:
          type: boolean
          description: "`true` — read, `false` — unread"
    EmailNotificationsRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: "`true` — notification emails on, `false` — off (ADR-0038)"

    BoardName:
      type: string
      minLength: 1
      maxLength: 200
    BoardProject:
      type: object
      required: [id, name, key, archivedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        key: { $ref: "#/components/schemas/ProjectKey" }
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: When the project was archived; `null` — active (ADR-0027)
    Board:
      type: object
      required: [id, name, ownerId, createdAt, updatedAt, projects, members, tasksCount]
      description: A board as its member sees it (ADR-0029)
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { $ref: "#/components/schemas/BoardName" }
        ownerId: { $ref: "#/components/schemas/Uuid" }
        createdAt: { $ref: "#/components/schemas/DateTime" }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
        projects:
          type: array
          description: Board projects where the current user is a project member, by name
          items: { $ref: "#/components/schemas/BoardProject" }
        members:
          type: array
          description: Board members — the owner first, the others in order of joining
          items: { $ref: "#/components/schemas/User" }
        tasksCount:
          type: integer
          minimum: 0
          description: The tasks `listBoardTasks` returns to the current user
    SearchResult:
      type: object
      required: [projects, boards, tasks]
      description: Search results by group, in the shapes of the lists (ADR-0030)
      properties:
        projects:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Project" }
        boards:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Board" }
        tasks:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Task" }
    CreateBoardRequest:
      type: object
      required: [name, projectIds]
      properties:
        name: { $ref: "#/components/schemas/BoardName" }
        projectIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/Uuid" }
        memberIds:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Uuid" }
    UpdateBoardRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/BoardName" }
    SetBoardProjectsRequest:
      type: object
      required: [projectIds]
      properties:
        projectIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/Uuid" }
    AddBoardMembersRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/Uuid" }

    ServiceSettings:
      type: object
      required: [serviceUrl, mail]
      properties:
        serviceUrl:
          type: string
          format: uri
          description: Web address with a path; links in emails and invitations are built from it
        mail:
          description: SMTP settings, or `null` if mail is not connected
          oneOf:
            - $ref: "#/components/schemas/MailSettings"
            - type: "null"
    UpdateServiceSettingsRequest:
      type: object
      required: [serviceUrl]
      properties:
        serviceUrl:
          type: string
          format: uri
    MailEncryption:
      type: string
      enum: [none, starttls, tls]
    MailSettings:
      type: object
      required: [host, port, encryption, sender, username, passwordSet]
      properties:
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        encryption: { $ref: "#/components/schemas/MailEncryption" }
        sender:
          type: string
          description: Sender, e.g. `TaskTrail <noreply@example.com>`
        username: { type: [string, "null"] }
        passwordSet:
          type: boolean
          description: Whether a password is saved; the API never returns the password itself (ADR-0015)
    MailSettingsRequest:
      type: object
      required: [host, port, encryption, sender]
      properties:
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        encryption: { $ref: "#/components/schemas/MailEncryption" }
        sender:
          type: string
          minLength: 1
          description: Email address, optionally with a name — `TaskTrail <noreply@example.com>`; otherwise `VALIDATION_FAILED`
        username:
          type: [string, "null"]
          minLength: 1
          description: "`null` — no SMTP sign-in"
        password:
          type: [string, "null"]
          minLength: 1
          description: Not passed — the saved one stays; `null` — delete the password
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [isAdmin, createdAt]
          properties:
            isAdmin: { type: boolean }
            createdAt: { $ref: "#/components/schemas/DateTime" }
    UpdateAdminUserRequest:
      type: object
      required: [isAdmin]
      properties:
        isAdmin: { type: boolean }
    PasswordResetLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt: { $ref: "#/components/schemas/DateTime" }
